blueprint:
  name: Beestat runtime data stale notification
  description: >-
    Run your notification action after the Runtime summary lag days sensor crosses above
    your threshold for the chosen duration. It monitors the age of daily Beestat
    history. It fires once per crossing, so a continuously stale value does not produce
    repeat notifications.
  domain: automation
  author: ItsColby
  homeassistant:
    min_version: 2026.8.0
  input:
    lag_sensor:
      name: Runtime summary lag sensor
      description: >-
        Select this integration's Runtime summary lag days sensor for one thermostat.
        The value must be in days; other duration units are not converted.
      selector:
        entity:
          filter:
            domain: sensor
            device_class: duration
    threshold_days:
      name: Stale threshold
      description: >-
        Notify when summary lag is strictly greater than this number of days.
      default: 1
      selector:
        number:
          min: 0
          max: 14
          step: 1
          unit_of_measurement: days
          mode: box
    stale_for:
      name: Stale duration
      description: >-
        Time the lag must stay above the threshold. A Home Assistant restart or
        automation reload resets the wait. See [numeric-state trigger
        behavior](https://www.home-assistant.io/triggers/numeric_state/).
      default:
        hours: 1
      selector:
        duration: {}
    notify_action:
      name: Notification action
      description: >-
        Choose the notification actions, destination, and message to use when the
        trigger fires.
      selector:
        action: {}

mode: single

triggers:
  - trigger: numeric_state
    entity_id: !input lag_sensor
    above: !input threshold_days
    for: !input stale_for

actions: !input notify_action
