blueprint:
  name: Beestat runtime data stale notification
  description: >-
    Run your chosen notification action when the age of Beestat's daily runtime
    summary crosses the selected threshold and stays above it for the configured
    duration. This measures delayed history, not live thermostat connectivity.
    The notification does not repeat while the value remains above the threshold.
    Restarting Home Assistant or reloading automations resets a pending duration.
  domain: automation
  author: ItsColby
  homeassistant:
    min_version: 2026.8.0
  input:
    lag_sensor:
      name: Runtime summary lag sensor
      description: Select this integration's Runtime summary lag days sensor. The comparison uses its numeric value in days; it does not convert other duration units.
      selector:
        entity:
          filter:
            domain: sensor
            device_class: duration
    threshold_days:
      name: Stale threshold
      description: Notify only after the lag crosses above this many days. A value equal to the threshold does not qualify. Adjust the starting value for the delay you want to monitor.
      default: 1
      selector:
        number:
          min: 0
          max: 14
          step: 1
          unit_of_measurement: days
          mode: box
    stale_for:
      name: Stale duration
      description: Wait this long after the threshold is crossed. The lag must stay above the threshold throughout the wait.
      default:
        hours: 1
      selector:
        duration: {}
    notify_action:
      name: Notification action
      description: Choose the actions that send your notification, including its destination and message. This blueprint does not select a notification service for you.
      selector:
        action: {}

mode: single

triggers:
  - trigger: numeric_state
    entity_id: !input lag_sensor
    above: !input threshold_days
    for: !input stale_for

actions: !input notify_action
