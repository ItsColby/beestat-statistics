name: Bug report
description: Describe a problem with setup, entities, filter estimates, or statistics imports
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Include the versions, steps, and evidence needed to reproduce the problem.
        Review every attachment before posting. Remove API keys, addresses,
        coordinates, serial numbers, and private device or entity names from logs
        and screenshots. Use the integration's redacted diagnostics rather than
        raw API responses.
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: Copy the installed version from HACS or the integration's manifest.json.
      placeholder: v2026.8.3
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.0
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - HACS
        - Manual custom_components copy
        - Development checkout
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: >-
        Describe the observed result, the expected result, and when it happened.
        For filter estimates, include the configured limits and whether runtime
        coverage is complete, partial, or unknown. Distinguish a Beestat value from
        an estimate calculated in Home Assistant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the shortest repeatable steps, including the action or options changed and the result after each step.
      placeholder: |
        1. Open ...
        2. Press ...
        3. See ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics and logs
      description: >-
        Download diagnostics from the Beestat Statistics entry under Settings >
        Devices & services. Add relevant log lines with timestamps and timezone.
        Inspect the contents for personal information before attaching them.
      render: text
