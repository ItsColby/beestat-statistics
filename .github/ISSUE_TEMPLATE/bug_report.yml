name: Bug report
description: >-
  Report unexpected behavior in Beestat Statistics.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Describe one reproducible problem and include the versions involved. Attach
        downloaded integration diagnostics when possible. Before posting, inspect all
        attachments and remove API keys and other credentials, addresses, coordinates,
        device identifiers, and private names. Configuration responses and raw Beestat
        payloads are not redacted diagnostics.
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: >-
        Installed Beestat Statistics version, as shown by HACS or the integration
        manifest.
      placeholder: v2026.8.3
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.0
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - HACS
        - Manual custom_components copy
        - Development checkout
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: >-
        Describe what you observed, what you expected, and when it happened. For filter
        estimates, include your runtime and age limits plus the reported runtime
        coverage. Identify whether the value came from Beestat or was calculated by this
        integration.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: >-
        List the steps that lead to the problem, including the action used and whether
        it happens every time.
      placeholder: |
        1. Open ...
        2. Press ...
        3. See ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics and logs
      description: >-
        Download diagnostics from the Beestat Statistics entry under Settings > Devices
        & services. Attach relevant log messages with timestamps and time zone, and
        review every attachment for private details before posting.
      render: text
