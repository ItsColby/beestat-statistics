version: 2
updates:
  # Python pins define the dependency-closed Home Assistant support lane and move
  # only with its product-owned Core and harness contracts. Pre-commit hook
  # revs are covered below.
  # The two groups run 12 hours apart so the first merges before the second
  # opens: main requires up-to-date branches and Dependabot rebases only on
  # conflict.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
      time: "18:00"
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns:
          - "*"
