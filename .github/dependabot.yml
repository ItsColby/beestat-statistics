version: 2
updates:
  # Python pins define dependency-closed Home Assistant support lanes and move
  # only with their product-owned Core and harness contracts. Pre-commit hook
  # revs are covered below.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns:
          - "*"
