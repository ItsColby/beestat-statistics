name: Beestat API Surface

on:
  schedule:
    - cron: "17 10 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beestat-api-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check upstream Beestat API surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python scripts/check_beestat_api_surface.py
