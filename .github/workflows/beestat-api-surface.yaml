name: Beestat API Surface

on:
  schedule:
    - cron: "17 10 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beestat-api-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check upstream Beestat API surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python scripts/check_beestat_api_surface.py
