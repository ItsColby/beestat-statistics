name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --group dev
      - run: pre-commit run --all-files --show-diff-on-failure

  home_assistant_minimum:
    name: Home Assistant minimum integration tests (Core 2026.8.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: |
          python -m pip install "pytest-homeassistant-custom-component==0.13.354" "mypy==2.3.0"
          python -m pip install --upgrade -r requirements-ha-test.txt
          python -m pip check
          python -m mypy custom_components/beestat_statistics
          python -m pytest tests

  home_assistant_current:
    name: Home Assistant current integration tests (Core 2026.9.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: |
          python -m pip install "pytest-homeassistant-custom-component==0.13.366" "mypy==2.3.0"
          python -m pip install --upgrade -r requirements-ha-current.txt
          python -m pip check
          python -m mypy custom_components/beestat_statistics
          python -m pytest tests

  hassfest:
    name: Hassfest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # zizmor: ignore[stale-action-refs] upstream publishes only from master

  hacs:
    name: HACS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # zizmor: ignore[stale-action-refs] upstream publishes only from main
        with:
          category: integration

  release_gate:
    name: Release gate
    if: ${{ always() }}
    needs: [unit, home_assistant_minimum, home_assistant_current, hassfest, hacs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          UNIT: ${{ needs.unit.result }}
          HOME_ASSISTANT_MINIMUM: ${{ needs.home_assistant_minimum.result }}
          HOME_ASSISTANT_CURRENT: ${{ needs.home_assistant_current.result }}
          HASSFEST: ${{ needs.hassfest.result }}
          HACS: ${{ needs.hacs.result }}
        run: |
          status=0
          for job in UNIT HOME_ASSISTANT_MINIMUM HOME_ASSISTANT_CURRENT HASSFEST HACS; do
            if [[ "${!job}" != success ]]; then
              echo "$job: expected success, got ${!job}"
              status=1
            fi
          done
          exit "$status"
