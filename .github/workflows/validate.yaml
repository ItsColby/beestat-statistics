name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.1"
          src: >-
            custom_components
            tests
            scripts
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q custom_components/beestat_statistics tests scripts
      - run: python scripts/check_public_safety.py
      - name: Validate JSON metadata
        run: >-
          python -c "import json, pathlib;
          [json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
          for path in
          ['custom_components/beestat_statistics/manifest.json',
          'custom_components/beestat_statistics/translations/en.json',
          'custom_components/beestat_statistics/icons.json',
          'hacs.json',
          'docs/beestat-api-surface.json']]"
      - name: Check trailing whitespace
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              path
              for root in ("custom_components", "tests", "blueprints", ".github", "scripts", "docs")
              for path in Path(root).rglob("*")
              if path.is_file()
              and "__pycache__" not in path.parts
              and path.suffix in {".json", ".md", ".py", ".yaml", ".yml"}
          ]
          paths.extend(Path(path) for path in ("README.md", "hacs.json"))
          failures = []
          for path in paths:
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if line.endswith((" ", "\t")):
                      failures.append(f"{path}:{lineno}")
          if failures:
              raise SystemExit("Trailing whitespace:\n" + "\n".join(failures))
          PY

  home_assistant:
    name: Home Assistant integration tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Minimum Core 2026.7.1
            requirements: requirements-ha-test.txt
          - name: Core 2026.8 beta
            requirements: requirements-ha-test-next.txt
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: pytest tests/test_config_flow_ha.py -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  release_gate:
    name: Release gate
    if: ${{ always() }}
    needs: [unit, home_assistant, hassfest, hacs]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          UNIT: ${{ needs.unit.result }}
          HOME_ASSISTANT: ${{ needs.home_assistant.result }}
          HASSFEST: ${{ needs.hassfest.result }}
          HACS: ${{ needs.hacs.result }}
        run: |
          test "$UNIT" = success
          test "$HOME_ASSISTANT" = success
          test "$HASSFEST" = success
          test "$HACS" = success
