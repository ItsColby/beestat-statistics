name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Run product-owned unit and static validation
        run: bash scripts/verify-release-local.sh unit native

  home_assistant_minimum:
    name: Home Assistant minimum integration tests (Core 2026.8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Run product-owned minimum-version validation
        run: bash scripts/verify-release-local.sh minimum native

  home_assistant_current:
    name: Home Assistant current-patch integration tests (Core 2026.8.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Run product-owned current-version validation
        run: bash scripts/verify-release-local.sh current native

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # zizmor: ignore[stale-action-refs] upstream publishes only from master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # zizmor: ignore[stale-action-refs] upstream publishes only from main
        with:
          category: integration

  release_gate:
    name: Release gate
    if: ${{ always() }}
    needs: [unit, home_assistant_minimum, home_assistant_current, hassfest, hacs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          UNIT: ${{ needs.unit.result }}
          HOME_ASSISTANT_MINIMUM: ${{ needs.home_assistant_minimum.result }}
          HOME_ASSISTANT_CURRENT: ${{ needs.home_assistant_current.result }}
          HASSFEST: ${{ needs.hassfest.result }}
          HACS: ${{ needs.hacs.result }}
        run: |
          test "$UNIT" = success
          test "$HOME_ASSISTANT_MINIMUM" = success
          test "$HOME_ASSISTANT_CURRENT" = success
          test "$HASSFEST" = success
          test "$HACS" = success
