name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install latest Python static-analysis tools
        run: python -m pip install --upgrade ruff shellcheck-py zizmor
      - name: Install latest workflow linter
        env:
          GOBIN: ${{ runner.temp }}/actionlint-bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Report static-analysis tool versions
        run: |
          actionlint -version
          shellcheck --version
          python -m ruff --version
          zizmor --version
      - name: Lint GitHub Actions workflows
        run: actionlint
      - name: Audit GitHub Actions security
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --strict-collection --persona auditor .
      - run: python -m ruff format --check custom_components tests scripts
      - run: python -m ruff check custom_components tests scripts
      - name: Run dependency-light unit tests
        run: python scripts/run_dependency_light_tests.py
      - run: python -m compileall -q custom_components/beestat_statistics tests scripts
      - run: python scripts/check_public_safety.py
      - name: Validate JSON metadata
        run: >-
          python -c "import json, pathlib;
          [json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
          for path in
          ['custom_components/beestat_statistics/manifest.json',
          'custom_components/beestat_statistics/translations/en.json',
          'custom_components/beestat_statistics/icons.json',
          'hacs.json',
          'docs/beestat-api-surface.json']]"
      - name: Check trailing whitespace
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              path
              for root in ("custom_components", "tests", "blueprints", ".github", "scripts", "docs")
              for path in Path(root).rglob("*")
              if path.is_file()
              and "__pycache__" not in path.parts
              and path.suffix in {".json", ".md", ".py", ".yaml", ".yml"}
          ]
          paths.extend(Path(path) for path in ("README.md", "hacs.json"))
          failures = []
          for path in paths:
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if line.endswith((" ", "\t")):
                      failures.append(f"{path}:{lineno}")
          if failures:
              raise SystemExit("Trailing whitespace:\n" + "\n".join(failures))
          PY

  home_assistant_minimum:
    name: Home Assistant minimum integration tests (Core 2026.8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Home Assistant test harness
        run: python -m pip install "pytest-homeassistant-custom-component==0.13.354"
      - name: Install supported Home Assistant Core
        run: python -m pip install --upgrade -r requirements-ha-test.txt
      - run: python -m pip install --upgrade mypy
      - name: Require dependency closure
        run: python -m pip check
      - run: python -m mypy --version
      - run: python -m mypy --strict custom_components/beestat_statistics
      - run: pytest tests -q

  home_assistant_current:
    name: Home Assistant current-patch integration tests (Core 2026.8.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Home Assistant test harness
        run: python -m pip install "pytest-homeassistant-custom-component==0.13.355"
      - name: Install current Home Assistant Core patch
        run: python -m pip install --upgrade -r requirements-ha-current.txt
      - name: Require dependency closure
        run: python -m pip check
      - run: pytest tests -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # zizmor: ignore[stale-action-refs] upstream publishes only from master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # zizmor: ignore[stale-action-refs] upstream publishes only from main
        with:
          category: integration

  release_gate:
    name: Release gate
    if: ${{ always() }}
    needs: [unit, home_assistant_minimum, home_assistant_current, hassfest, hacs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          UNIT: ${{ needs.unit.result }}
          HOME_ASSISTANT_MINIMUM: ${{ needs.home_assistant_minimum.result }}
          HOME_ASSISTANT_CURRENT: ${{ needs.home_assistant_current.result }}
          HASSFEST: ${{ needs.hassfest.result }}
          HACS: ${{ needs.hacs.result }}
        run: |
          test "$UNIT" = success
          test "$HOME_ASSISTANT_MINIMUM" = success
          test "$HOME_ASSISTANT_CURRENT" = success
          test "$HASSFEST" = success
          test "$HACS" = success
