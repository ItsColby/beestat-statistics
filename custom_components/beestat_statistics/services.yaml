import_statistics:
  name: Import Beestat statistics
  description: >-
    Refresh Beestat runtime and metadata, update integration entities, and import
    history using hourly statistics for selected quantities and daily statistics for
    enabled quantities that have not been selected.
  fields:
    point_lookback_days:
      name: Point lookback days
      description: >-
        Days of five-minute thermostat and room-sensor history to read for this import.
        Omit to use the configured lookback.
      required: false
      selector:
        number:
          min: 1
          max: 366
          step: 1
          mode: box
    skip_sync:
      name: Skip Beestat sync
      description: >-
        Skip requesting a Beestat refresh from ecobee. The import still reads data from
        Beestat over the network.
      required: false
      default: false
      selector:
        boolean: {}
get_configuration:
  name: Get Beestat configuration
  description: >-
    Read saved settings, effective mappings, filter state, hourly status, and source details without
    contacting Beestat or changing state. Credentials are omitted; private identifiers
    and household details are included.
  fields:
    config_entry_id:
      name: Configuration entry
      description: >-
        Loaded Beestat Statistics entry to inspect.
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
get_raw_points:
  name: Get raw Beestat points
  description: >-
    Read bounded point history for one configured resource using cached identity
    metadata. Requires an active administrator. Does not sync or refresh Beestat,
    import statistics, or change saved state. The response contains private raw history.
  fields:
    config_entry_id:
      name: Configuration entry
      description: Loaded Beestat Statistics entry containing the resource.
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    resource:
      name: Resource
      description: Fixed point-history resource to read.
      required: true
      selector:
        select:
          options:
            - runtime_thermostat
            - runtime_sensor
    resource_id:
      name: Resource ID
      description: Positive integer ID of a configured thermostat or room sensor.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    start:
      name: Start timestamp
      description: Inclusive timestamp with an explicit UTC offset and no fractional seconds.
      required: true
      selector:
        text: {}
    end:
      name: End timestamp
      description: Inclusive timestamp after start, at most 31 elapsed days later, with an explicit UTC offset and no fractional seconds.
      required: true
      selector:
        text: {}
select_hourly_statistics:
  name: Select hourly Beestat statistics
  description: >-
    Preview explicitly selected hourly statistics or a recovery segment. To apply,
    repeat the same selection with its returned preview digest and expected revision.
    Reads Beestat history and can reconcile pending effects. Applying freezes legacy
    writes for selected quantities and updates retained selection and Recorder statistics.
    Other enabled quantities continue daily imports.
  fields:
    config_entry_id:
      name: Configuration entry
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    epoch_start:
      name: First hour
      description: Whole UTC hour with an explicit offset, within the past 366 days.
      required: true
      selector:
        datetime: {}
    statistic_ids:
      name: Statistic IDs
      description: Explicit hourly base statistic IDs to select; no automatic selection.
      required: true
      selector:
        text:
          multiple: true
    expected_revision:
      name: Expected revision
      description: Current hourly statistics revision from Get Beestat configuration.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    preview_digest:
      name: Preview digest
      description: Omit for a preview. Supply the returned digest to apply that exact selection.
      selector:
        text: {}
get_hourly_coverage:
  name: Get hourly Beestat coverage
  description: >-
    Read cached v2 coverage or, with contract version 3, qualified logical history
    and bounded Recorder verification. Does not contact Beestat, import statistics,
    reconcile pending work, or change retained state.
  fields:
    config_entry_id:
      name: Configuration entry
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    start:
      name: Start hour
      description: Inclusive whole UTC hour with an explicit offset.
      required: true
      selector:
        datetime: {}
    end:
      name: End hour
      description: Exclusive whole UTC hour, at most 366 elapsed days after start.
      required: true
      selector:
        datetime: {}
    statistic_ids:
      name: Statistic IDs
      description: V2 only. Omit to inspect all selected hourly series. For contract version 3 use quantity IDs.
      selector:
        text:
          multiple: true
    contract_version:
      name: Contract version
      description: Set to 3 for qualified logical history. Omit to retain the v2 coverage response.
      selector:
        number:
          min: 3
          max: 3
          step: 1
          mode: box
    quantity_ids:
      name: Quantity IDs
      description: Required for contract version 3. Select 1–40 distinct physical quantity IDs from Get Beestat configuration.
      selector:
        text:
          multiple: true
    period:
      name: Bucket period
      description: Contract version 3 only. Hourly UTC buckets or local calendar days; defaults to hour.
      selector:
        select:
          options:
            - hour
            - day
    daily_policy:
      name: Daily history policy
      description: Contract version 3 only. Prefer complete point days, then qualified closed legacy days, then partial point subtotals. Never adds the sources.
      selector:
        select:
          options:
            - complete_points_else_legacy_day
    page_size:
      name: Page size
      description: Contract version 3 only. Maximum returned buckets across all quantities, from 1 to 4096; defaults to 4096.
      selector:
        number:
          min: 1
          max: 4096
          step: 1
          mode: box
    offset:
      name: Page offset
      description: Contract version 3 only. Zero-based bucket offset; defaults to 0. For later pages use the returned next_offset.
      selector:
        number:
          min: 0
          step: 1
          mode: box
    view_token:
      name: View token
      description: Contract version 3 only. Repeat the returned 64-character SHA-256 view token on later pages to reject changed history.
      selector:
        text: {}
    evaluated_at:
      name: Evaluation timestamp
      description: Contract version 3 only. Repeat the returned evaluation timestamp, including its UTC offset, on later pages.
      selector:
        text: {}
stage_hourly_source:
  name: Stage hourly Beestat source
  description: >-
    Retain one verified original JSON or JSONL source chunk and its sealed manifest.
    Requires an active administrator. Does not select quantities, change writer
    reservations, or write Recorder statistics.
  fields:
    config_entry_id:
      name: Configuration entry
      description: Loaded Beestat Statistics entry whose physical source identity matches the manifest.
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    file_id:
      name: Source file
      description: Original UTF-8 JSON or JSONL chunk, at most 8 MiB and 10,000 rows. Uses the native upload handle; paths and URLs are not accepted.
      required: true
      selector:
        file:
          accept: application/json,application/x-ndjson,.json,.jsonl
    sha256:
      name: Original file digest
      description: Exact 64-character lowercase SHA-256 digest of the original uploaded bytes.
      required: true
      selector:
        text: {}
    manifest:
      name: Source manifest
      description: Contract 3 source manifest containing entry/account/resource identity, acquisition and chunk order, format, explicit-offset timestamps, source kind, and beestat_points_v1 unit contract.
      required: true
      selector:
        object: {}
plan_hourly_history:
  name: Plan hourly Beestat history
  description: >-
    Read sealed source evidence, current ownership, and bounded Recorder rows to
    prepare an exact adoption or repair plan. Requires an active administrator.
    Does not fetch source data, reconcile pending work, or change state.
  fields:
    config_entry_id:
      name: Configuration entry
      description: Loaded Beestat Statistics entry to plan.
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    source_ids:
      name: Sealed source IDs
      description: From 1 to 2048 distinct source manifest SHA-256 IDs returned by Stage hourly Beestat source.
      required: true
      selector:
        text:
          multiple: true
    quantity_ids:
      name: Quantity IDs
      description: From 1 to 40 distinct physical quantity IDs from Get Beestat configuration.
      required: true
      selector:
        text:
          multiple: true
    start:
      name: Start hour
      description: Inclusive whole UTC hour with an explicit offset.
      required: true
      selector:
        text: {}
    end:
      name: End hour
      description: Exclusive whole UTC hour with an explicit offset, at most 366 elapsed days after start.
      required: true
      selector:
        text: {}
    archive_policy:
      name: Archive admission policy
      description: Reject archives, or explicitly qualify archive-only points before the first provider point. Conflicting observations remain blocked.
      required: true
      selector:
        select:
          options:
            - reject
            - before_first_provider
    daily_policy:
      name: Daily history policy
      description: Prefer complete point days, then qualified closed legacy days, then partial point subtotals. Never adds the sources.
      required: true
      selector:
        select:
          options:
            - complete_points_else_legacy_day
    operation_id:
      name: Operation ID
      description: Unique ID for this exact operation, 1–256 characters. Reuse only for the same intended plan.
      required: true
      selector:
        text: {}
    expected_revision:
      name: Expected revision
      description: Current nonnegative integer history_v3 revision from Get Beestat configuration.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    consumer_contract:
      name: Consumer contract
      description: Contract version 3 and 1–16 consumers, each declaring consumer_id, version, history_contract 3, and daily_policy complete_points_else_legacy_day. This declaration does not validate the consumers.
      required: true
      selector:
        object: {}
    recovery_reference:
      name: Recovery reference
      description: Reference to the consistent recovery set, 1–256 characters. This declaration does not create or verify a backup.
      required: true
      selector:
        text: {}
    evaluated_at:
      name: Evaluation timestamp
      description: Omit for the first plan. Repeat the returned timestamp with its UTC offset when requesting more detail pages of that plan.
      selector:
        text: {}
    detail_offset:
      name: Detail offset
      description: Zero-based batch detail offset. Does not change the semantic plan digest.
      default: 0
      selector:
        number:
          min: 0
          step: 1
          mode: box
    detail_limit:
      name: Detail limit
      description: Maximum batch details to return, from 1 to 100.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
apply_hourly_history:
  name: Apply hourly Beestat history
  description: >-
    Accept the exact reviewed plan and reserve its selected quantities for v3.
    Requires an active administrator. The entry worker writes and verifies
    Recorder batches; inspect history status for completion or a blocked operation.
  fields:
    config_entry_id:
      name: Configuration entry
      description: Loaded Beestat Statistics entry matching the nested plan.
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    plan_digest:
      name: Plan digest
      description: Exact 64-character lowercase SHA-256 plan_digest returned by Plan hourly Beestat history.
      required: true
      selector:
        text: {}
    plan:
      name: Exact plan request
      description: Complete unchanged request object returned by Plan hourly Beestat history, including its config_entry_id, evaluated_at, consumer contract, recovery reference, and expected revision.
      required: true
      selector:
        object: {}
repair_filter_change_boundary:
  name: Repair filter change boundary
  description: >-
    Correct the time of a filter change already saved in Home Assistant on the same
    date. Refreshes Beestat to recalculate runtime; reconciliation may remain pending.
    This correction does not dismiss filter alerts.
  fields:
    config_entry_id:
      name: Configuration entry
      description: >-
        Loaded Beestat Statistics entry containing the thermostat.
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    thermostat_id:
      name: Thermostat ID
      description: >-
        Beestat thermostat with a saved Home Assistant filter-date override to correct.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    changed_at:
      name: Changed at
      description: >-
        Verified replacement time on the saved date, within the past 31 days. Dates use
        Home Assistant's time zone; include a UTC offset to avoid clock-change
        ambiguity.
      required: true
      selector:
        datetime: {}
record_filter_change:
  name: Record filter change
  description: >-
    Record a completed physical filter replacement using its actual time and the
    captured previous saved state. Keep that previous state unchanged on retries.
    Attempts to dismiss matching filter alerts and refresh runtime. Check the returned
    status; runtime reconciliation may remain pending.
  fields:
    config_entry_id:
      name: Configuration entry
      description: >-
        Loaded Beestat Statistics entry containing the thermostat.
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    thermostat_id:
      name: Thermostat ID
      description: >-
        Beestat thermostat whose filter was replaced.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    changed_at:
      name: Changed at
      description: >-
        Actual replacement time within the past 31 days, no later than now, after any
        saved timestamp and not before the saved date. Include a UTC offset to
        distinguish repeated local times.
      required: true
      selector:
        datetime: {}
    expected_changed_at:
      name: Expected previous timestamp
      description: >-
        Previous filter_changed_at from saved_overrides.thermostats in Get Beestat
        configuration. Use null when absent.
      required: true
      selector:
        datetime: {}
    expected_changed_date:
      name: Expected previous date
      description: >-
        Previous filter_changed_date from saved_overrides.thermostats in Get Beestat
        configuration. Use null when absent.
      required: true
      selector:
        date: {}
    expected_request_id:
      name: Expected previous request ID
      description: >-
        Previous filter_change_event.request_id from saved_overrides.thermostats in Get
        Beestat configuration. Use null when absent.
      required: true
      selector:
        text: {}
    request_id:
      name: Request ID
      description: >-
        Unique ID for this replacement, 1–128 characters. Reuse the same ID and
        replacement time when retrying the same request.
      required: true
      selector:
        text: {}
rebuild_statistics:
  name: Rebuild Beestat statistics
  description: >-
    Reimport historical Beestat statistics. Cumulative totals are rebuilt from the start
    date through the latest available source interval; measurement series use the selected date range.
  fields:
    thermostat_id:
      name: Thermostat ID
      description: >-
        Beestat thermostat to rebuild, including its room sensors. Omit to rebuild all
        included sources.
      required: false
      selector:
        number:
          min: 1
          step: 1
          mode: box
    start_date:
      name: Start date
      description: >-
        First local date to update in Recorder. Daily mode uses summary history;
        hourly mode requires raw observations and verified continuity, within 366 elapsed days.
        Omit to use the configured history lookback for hourly data.
      required: false
      selector:
        date: {}
    end_date:
      name: End date
      description: >-
        Last local date to update for measurements. Cumulative totals are updated
        through the latest available source interval. Omit to read point history through now.
      required: false
      selector:
        date: {}
    skip_sync:
      name: Skip Beestat sync
      description: >-
        Skip requesting a Beestat refresh from ecobee. The rebuild still reads data from
        Beestat over the network.
      required: false
      default: false
      selector:
        boolean: {}
