import_statistics:
  fields:
    point_lookback_days:
      required: false
      selector:
        number:
          min: 1
          max: 366
          step: 1
          mode: box
    skip_sync:
      required: false
      default: false
      selector:
        boolean: {}
get_configuration:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
get_raw_points:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    resource:
      required: true
      selector:
        select:
          options:
            - runtime_thermostat
            - runtime_sensor
    resource_id:
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    start:
      required: true
      selector:
        text: {}
    end:
      required: true
      selector:
        text: {}
get_hourly_coverage:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    start:
      required: true
      selector:
        datetime: {}
    end:
      required: true
      selector:
        datetime: {}
    contract_version:
      required: true
      selector:
        number:
          min: 3
          max: 3
          step: 1
          mode: box
    quantity_ids:
      required: true
      selector:
        text:
          multiple: true
    period:
      selector:
        select:
          options:
            - hour
            - day
    daily_policy:
      selector:
        select:
          options:
            - complete_points_else_legacy_day
    page_size:
      selector:
        number:
          min: 1
          max: 4096
          step: 1
          mode: box
    offset:
      selector:
        number:
          min: 0
          step: 1
          mode: box
    view_token:
      selector:
        text: {}
    evaluated_at:
      selector:
        text: {}
stage_hourly_source:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    file_id:
      required: true
      selector:
        file:
          accept: application/json,application/x-ndjson,.json,.jsonl
    sha256:
      required: true
      selector:
        text: {}
    manifest:
      required: true
      selector:
        object: {}
plan_hourly_history:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    source_ids:
      required: true
      selector:
        text:
          multiple: true
    quantity_ids:
      required: true
      selector:
        text:
          multiple: true
    start:
      required: true
      selector:
        text: {}
    end:
      required: true
      selector:
        text: {}
    archive_policy:
      required: true
      selector:
        select:
          options:
            - reject
            - before_first_provider
    daily_policy:
      required: true
      selector:
        select:
          options:
            - complete_points_else_legacy_day
    operation_id:
      required: true
      selector:
        text: {}
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    consumer_contract:
      required: true
      selector:
        object: {}
    recovery_reference:
      required: true
      selector:
        text: {}
    evaluated_at:
      selector:
        text: {}
    detail_offset:
      default: 0
      selector:
        number:
          min: 0
          step: 1
          mode: box
    detail_limit:
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
apply_hourly_history:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    plan_digest:
      required: true
      selector:
        text: {}
    plan:
      required: true
      selector:
        object: {}
repair_filter_change_boundary:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    thermostat_id:
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    changed_at:
      required: true
      selector:
        datetime: {}
record_filter_change:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    thermostat_id:
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    changed_at:
      required: true
      selector:
        datetime: {}
    expected_changed_at:
      required: true
      selector:
        datetime: {}
    expected_changed_date:
      required: true
      selector:
        date: {}
    expected_request_id:
      required: true
      selector:
        text: {}
    request_id:
      required: true
      selector:
        text: {}
rebuild_statistics:
  fields:
    thermostat_id:
      required: false
      selector:
        number:
          min: 1
          step: 1
          mode: box
    start_date:
      required: false
      selector:
        date: {}
    end_date:
      required: false
      selector:
        date: {}
    skip_sync:
      required: false
      default: false
      selector:
        boolean: {}
