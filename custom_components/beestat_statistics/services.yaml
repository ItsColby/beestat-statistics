import_statistics:
  name: Import Beestat statistics
  description: >-
    Refresh Beestat runtime and metadata, update integration entities, and import
    history using the entry's selected daily or hourly statistics mode.
  fields:
    point_lookback_days:
      name: Point lookback days
      description: >-
        Days of five-minute thermostat and room-sensor history to read for this import.
        Omit to use the configured lookback.
      required: false
      selector:
        number:
          min: 1
          max: 366
          step: 1
          mode: box
    skip_sync:
      name: Skip Beestat sync
      description: >-
        Skip requesting a Beestat refresh from ecobee. The import still reads data from
        Beestat over the network.
      required: false
      default: false
      selector:
        boolean: {}
get_configuration:
  name: Get Beestat configuration
  description: >-
    Read saved settings, effective mappings, filter state, hourly status, and source details without
    contacting Beestat or changing state. Credentials are omitted; private identifiers
    and household details are included.
  fields:
    config_entry_id:
      name: Configuration entry
      description: >-
        Loaded Beestat Statistics entry to inspect.
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
select_hourly_statistics:
  name: Select hourly Beestat statistics
  description: >-
    Preview explicitly selected hourly statistics or a recovery segment. To apply,
    repeat the same selection with its returned preview digest and expected revision.
    Reads Beestat history; applying updates retained selection and Recorder statistics.
  fields:
    config_entry_id:
      name: Configuration entry
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    epoch_start:
      name: First hour
      description: Whole UTC hour with an explicit offset, within the past 366 days.
      required: true
      selector:
        datetime: {}
    statistic_ids:
      name: Statistic IDs
      description: Explicit hourly base statistic IDs to select; no automatic selection.
      required: true
      selector:
        text:
          multiple: true
    expected_revision:
      name: Expected revision
      description: Current hourly statistics revision from Get Beestat configuration.
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    preview_digest:
      name: Preview digest
      description: Omit for a preview. Supply the returned digest to apply that exact selection.
      selector:
        text: {}
get_hourly_coverage:
  name: Get hourly Beestat coverage
  description: >-
    Read cached hourly coverage and selected identities without contacting Beestat,
    importing statistics, or changing retained state.
  fields:
    config_entry_id:
      name: Configuration entry
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    start:
      name: Start hour
      description: Inclusive whole UTC hour with an explicit offset.
      required: true
      selector:
        datetime: {}
    end:
      name: End hour
      description: Exclusive whole UTC hour, at most 366 elapsed days after start.
      required: true
      selector:
        datetime: {}
    statistic_ids:
      name: Statistic IDs
      description: Omit to inspect all selected hourly series.
      selector:
        text:
          multiple: true
repair_filter_change_boundary:
  name: Repair filter change boundary
  description: >-
    Correct the time of a filter change already saved in Home Assistant on the same
    date. Refreshes Beestat to recalculate runtime; reconciliation may remain pending.
    This correction does not dismiss filter alerts.
  fields:
    config_entry_id:
      name: Configuration entry
      description: >-
        Loaded Beestat Statistics entry containing the thermostat.
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    thermostat_id:
      name: Thermostat ID
      description: >-
        Beestat thermostat with a saved Home Assistant filter-date override to correct.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    changed_at:
      name: Changed at
      description: >-
        Verified replacement time on the saved date, within the past 31 days. Dates use
        Home Assistant's time zone; include a UTC offset to avoid clock-change
        ambiguity.
      required: true
      selector:
        datetime: {}
record_filter_change:
  name: Record filter change
  description: >-
    Record a completed physical filter replacement using its actual time and the
    captured previous saved state. Keep that previous state unchanged on retries.
    Attempts to dismiss matching filter alerts and refresh runtime. Check the returned
    status; runtime reconciliation may remain pending.
  fields:
    config_entry_id:
      name: Configuration entry
      description: >-
        Loaded Beestat Statistics entry containing the thermostat.
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    thermostat_id:
      name: Thermostat ID
      description: >-
        Beestat thermostat whose filter was replaced.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    changed_at:
      name: Changed at
      description: >-
        Actual replacement time within the past 31 days, no later than now, after any
        saved timestamp and not before the saved date. Include a UTC offset to
        distinguish repeated local times.
      required: true
      selector:
        datetime: {}
    expected_changed_at:
      name: Expected previous timestamp
      description: >-
        Previous filter_changed_at from saved_overrides.thermostats in Get Beestat
        configuration. Use null when absent.
      required: true
      selector:
        datetime: {}
    expected_changed_date:
      name: Expected previous date
      description: >-
        Previous filter_changed_date from saved_overrides.thermostats in Get Beestat
        configuration. Use null when absent.
      required: true
      selector:
        date: {}
    expected_request_id:
      name: Expected previous request ID
      description: >-
        Previous filter_change_event.request_id from saved_overrides.thermostats in Get
        Beestat configuration. Use null when absent.
      required: true
      selector:
        text: {}
    request_id:
      name: Request ID
      description: >-
        Unique ID for this replacement, 1–128 characters. Reuse the same ID and
        replacement time when retrying the same request.
      required: true
      selector:
        text: {}
rebuild_statistics:
  name: Rebuild Beestat statistics
  description: >-
    Reimport historical Beestat statistics. Cumulative totals are rebuilt from the start
    date through the latest available source interval; measurement series use the selected date range.
  fields:
    thermostat_id:
      name: Thermostat ID
      description: >-
        Beestat thermostat to rebuild, including its room sensors. Omit to rebuild all
        included sources.
      required: false
      selector:
        number:
          min: 1
          step: 1
          mode: box
    start_date:
      name: Start date
      description: >-
        First local date to update in Recorder. Daily mode uses summary history;
        hourly mode requires raw observations and verified continuity, within 366 elapsed days.
        Omit to use the configured history lookback for hourly data.
      required: false
      selector:
        date: {}
    end_date:
      name: End date
      description: >-
        Last local date to update for measurements. Cumulative totals are updated
        through the latest available source interval. Omit to read point history through now.
      required: false
      selector:
        date: {}
    skip_sync:
      name: Skip Beestat sync
      description: >-
        Skip requesting a Beestat refresh from ecobee. The rebuild still reads data from
        Beestat over the network.
      required: false
      default: false
      selector:
        boolean: {}
