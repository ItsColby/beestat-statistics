import_statistics:
  name: Import Beestat statistics
  description: >-
    Refresh Beestat runtime and metadata, update integration entities, and import daily
    history into Home Assistant's long-term statistics.
  fields:
    point_lookback_days:
      name: Point lookback days
      description: >-
        Days of five-minute thermostat and room-sensor history to read for this import.
        Omit to use the configured lookback.
      required: false
      selector:
        number:
          min: 1
          max: 366
          step: 1
          mode: box
    skip_sync:
      name: Skip Beestat sync
      description: >-
        Skip requesting a Beestat refresh from ecobee. The import still reads data from
        Beestat over the network.
      required: false
      default: false
      selector:
        boolean: {}
get_configuration:
  name: Get Beestat configuration
  description: >-
    Read saved settings, effective mappings, filter state, and source details without
    contacting Beestat or changing state. Credentials are omitted; private identifiers
    and household details are included.
  fields:
    config_entry_id:
      name: Configuration entry
      description: >-
        Loaded Beestat Statistics entry to inspect.
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
repair_filter_change_boundary:
  name: Repair filter change boundary
  description: >-
    Correct the time of a filter change already saved in Home Assistant on the same
    date. Refreshes Beestat to recalculate runtime; reconciliation may remain pending.
    This correction does not dismiss filter alerts.
  fields:
    config_entry_id:
      name: Configuration entry
      description: >-
        Loaded Beestat Statistics entry containing the thermostat.
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    thermostat_id:
      name: Thermostat ID
      description: >-
        Beestat thermostat with a saved Home Assistant filter-date override to correct.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    changed_at:
      name: Changed at
      description: >-
        Verified replacement time on the saved date, within the past 31 days. Dates use
        Home Assistant's time zone; include a UTC offset to avoid clock-change
        ambiguity.
      required: true
      selector:
        datetime: {}
record_filter_change:
  name: Record filter change
  description: >-
    Record a completed physical filter replacement using its actual time and the
    captured previous saved state. Keep that previous state unchanged on retries.
    Attempts to dismiss matching filter alerts and refresh runtime. Check the returned
    status; runtime reconciliation may remain pending.
  fields:
    config_entry_id:
      name: Configuration entry
      description: >-
        Loaded Beestat Statistics entry containing the thermostat.
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    thermostat_id:
      name: Thermostat ID
      description: >-
        Beestat thermostat whose filter was replaced.
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    changed_at:
      name: Changed at
      description: >-
        Actual replacement time within the past 31 days, no later than now, after any
        saved timestamp and not before the saved date. Include a UTC offset to
        distinguish repeated local times.
      required: true
      selector:
        datetime: {}
    expected_changed_at:
      name: Expected previous timestamp
      description: >-
        Previous filter_changed_at from saved_overrides.thermostats in Get Beestat
        configuration. Use null when absent.
      required: true
      selector:
        datetime: {}
    expected_changed_date:
      name: Expected previous date
      description: >-
        Previous filter_changed_date from saved_overrides.thermostats in Get Beestat
        configuration. Use null when absent.
      required: true
      selector:
        date: {}
    expected_request_id:
      name: Expected previous request ID
      description: >-
        Previous filter_change_event.request_id from saved_overrides.thermostats in Get
        Beestat configuration. Use null when absent.
      required: true
      selector:
        text: {}
    request_id:
      name: Request ID
      description: >-
        Unique ID for this replacement, 1–128 characters. Reuse the same ID and
        replacement time when retrying the same request.
      required: true
      selector:
        text: {}
rebuild_statistics:
  name: Rebuild Beestat statistics
  description: >-
    Reimport historical Beestat statistics. Cumulative totals are rebuilt from the start
    date through the latest source day; measurement series use the selected date range.
  fields:
    thermostat_id:
      name: Thermostat ID
      description: >-
        Beestat thermostat to rebuild, including its room sensors. Omit to rebuild all
        included sources.
      required: false
      selector:
        number:
          min: 1
          step: 1
          mode: box
    start_date:
      name: Start date
      description: >-
        First local date to update in Recorder. Earlier summary history is read to
        calculate cumulative totals. Omit for all available summaries and the configured
        point-history lookback.
      required: false
      selector:
        date: {}
    end_date:
      name: End date
      description: >-
        Last local date to update for measurements. Cumulative totals are updated
        through the latest source day. Omit to read point history through now.
      required: false
      selector:
        date: {}
    skip_sync:
      name: Skip Beestat sync
      description: >-
        Skip requesting a Beestat refresh from ecobee. The rebuild still reads data from
        Beestat over the network.
      required: false
      default: false
      selector:
        boolean: {}
