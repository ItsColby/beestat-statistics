import_statistics:
  name: Import Beestat statistics
  description: "Refresh Beestat runtime and metadata, update the integration entities, and import daily statistics into Home Assistant Recorder."
  fields:
    point_lookback_days:
      name: Point lookback days
      description: "Recent local days of five-minute thermostat and room-sensor history to read, including setpoints and available air-quality data. Overrides the configured lookback for this import."
      required: false
      selector:
        number:
          min: 1
          max: 366
          step: 1
          mode: box
    skip_sync:
      name: Skip Beestat sync
      description: "Skip the Beestat sync requests before reading and importing data. This does not make the import network-free."
      required: false
      default: false
      selector:
        boolean: {}
get_configuration:
  name: Get Beestat configuration
  description: "Read saved options, effective entity mappings, comfort profiles, and the allowed cached Ecobee settings. This action returns data without contacting Beestat or changing state."
  fields:
    config_entry_id:
      name: Configuration entry
      description: "The loaded Beestat Statistics entry to inspect."
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
repair_filter_change_boundary:
  name: Repair filter change boundary
  description: "Refine the exact time of a filter change already saved in Home Assistant. Its local date must match the saved override date. Refreshes Beestat runtime after saving; incomplete history can leave reconciliation pending. This action does not acknowledge filter alerts or change Ecobee settings."
  fields:
    config_entry_id:
      name: Configuration entry
      description: "The loaded Beestat Statistics entry containing this thermostat."
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    thermostat_id:
      name: Thermostat ID
      description: "The configured Beestat thermostat with an existing Home Assistant filter-date override to refine."
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    changed_at:
      name: Changed at
      description: "Verified time of the existing replacement, no more than 31 days old and not in the future. A value without an offset uses Home Assistant's timezone; ambiguous or nonexistent local times are rejected."
      required: true
      selector:
        datetime: {}
record_filter_change:
  name: Record filter change
  description: "Save a physical replacement at its actual time, guarded by the previous boundary and request ID. Attempts to acknowledge matching filter alerts and refresh Beestat runtime. Handle the returned status before taking further action; runtime reconciliation may remain pending. Use a date edit or boundary repair for corrections."
  fields:
    config_entry_id:
      name: Configuration entry
      description: "The loaded Beestat Statistics entry containing this thermostat."
      required: true
      selector:
        config_entry:
          integration: beestat_statistics
    thermostat_id:
      name: Thermostat ID
      description: "The configured Beestat thermostat whose filter was replaced."
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    changed_at:
      name: Changed at
      description: "For a new replacement, use its actual time within the last 31 days and not in the future. It cannot predate the saved date and must follow any saved exact time. Include a UTC offset to distinguish repeated local times."
      required: true
      selector:
        datetime: {}
    expected_changed_at:
      name: Expected previous timestamp
      description: "The prior filter_changed_at value from the Filter changed date entity, or null if no exact time is saved."
      required: true
      selector:
        datetime: {}
    expected_changed_date:
      name: Expected previous date
      description: "The prior home_assistant_override_date value from the Filter changed date entity, or null if no override date is saved."
      required: true
      selector:
        date: {}
    expected_request_id:
      name: Expected previous request ID
      description: "The prior filter_change_event.request_id captured for this replacement, or null if none exists. Keep that token when retrying; a later correction must not authorize an older request."
      required: true
      selector:
        text: {}
    request_id:
      name: Request ID
      description: "An opaque ID of 1–128 characters for this replacement. An identical retry of the current saved request returns already_recorded without repeating effects, even after 31 days. Use a new ID for a new replacement."
      required: true
      selector:
        text: {}
rebuild_statistics:
  name: Rebuild Beestat statistics
  description: "Recalculate Recorder statistics from the complete available Beestat summary history. Cumulative totals are rewritten from the start date through the latest source day; measurement series use the selected date range."
  fields:
    thermostat_id:
      name: Thermostat ID
      description: "Rebuild one configured Beestat thermostat and its sensors. Omit to rebuild all configured sources."
      required: false
      selector:
        number:
          min: 1
          step: 1
          mode: box
    start_date:
      name: Start date
      description: "First local date to write to Recorder. Earlier source history is still read to calculate cumulative totals."
      required: false
      selector:
        date: {}
    end_date:
      name: End date
      description: "Last local date to write for measurement series. Cumulative totals continue through the latest source day so later values stay consistent."
      required: false
      selector:
        date: {}
    skip_sync:
      name: Skip Beestat sync
      description: "Skip the Beestat sync requests before reading and rebuilding data. This does not make the rebuild network-free."
      required: false
      default: false
      selector:
        boolean: {}
