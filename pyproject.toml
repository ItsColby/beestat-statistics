[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
extend-select = [
  "A001",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C901",
  "DTZ",
  "G",
  "ICN001",
  "LOG",
  "N804",
  "N805",
  "N806",
  "N815",
  "N818",
  "PERF",
  "PGH",
  "PIE",
  "PLC",
  "PLE",
  "PLW",
  "RET",
  "RSE",
  "RUF",
  "S102",
  "S103",
  "S104",
  "S107",
  "S108",
  "S113",
  "S301",
  "S306",
  "S307",
  "S310",
  "S313",
  "S314",
  "S315",
  "S316",
  "S317",
  "S318",
  "S319",
  "S324",
  "S501",
  "S506",
  "S507",
  "S601",
  "S602",
  "S604",
  "S608",
  "S609",
  "T100",
  "T20",
  "TID",
]
ignore = [
  "ASYNC109",
  "ASYNC240",
  "PLW0108",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
show_error_codes = true
files = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = ["pre-commit==4.6.2"]
ha-minimum = [
  "homeassistant==2026.8.0",
  "pytest-homeassistant-custom-component==0.13.354",
  "mypy==2.3.0",
]
ha-current = [
  "homeassistant==2026.9.4",
  "pytest-homeassistant-custom-component==0.13.367",
  "mypy==2.3.0",
]
